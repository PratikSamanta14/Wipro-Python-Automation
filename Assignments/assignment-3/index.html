<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - CSS Selectors</title>
</head>

<body>

    <div id="main-container">

        <h1 id="heading">
            CSS Selector Challenge
        </h1>

        <div class="item" data-type="primary">
            Primary Item
        </div>

        <div class="item" data-type="secondary">
            Secondary Item
        </div>

        <div class="item" data-name="selenium-test">
            Selenium Item
        </div>

        <div id="parent">

            <span class="child">
                Direct Child
            </span>

            <div>
                <span class="nested">
                    Nested Descendant
                </span>
            </div>

        </div>

        <br>

        <input type="text"
               name="username"
               placeholder="Enter username">

        <br><br>

        <input type="email"
               name="user-email"
               placeholder="Enter email">

        <br><br>

        <button class="submit-button">
            Submit
        </button>

    </div>

</body>
</html>

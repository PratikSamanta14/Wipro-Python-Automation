<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium Assignment 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            cursor: pointer;
        }

        .links {
            margin-top: 25px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Login Page</h1>

        <form>

            <!-- Username identified using ID -->
            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
            >

            <!-- Password identified using NAME -->
            <label for="password">Password:</label>
            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter password"
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="links">

            <!-- Link identified using LINK_TEXT -->
            <a href="https://www.selenium.dev/">
                Selenium Website
            </a>

        </div>

    </div>

</body>
</html>
